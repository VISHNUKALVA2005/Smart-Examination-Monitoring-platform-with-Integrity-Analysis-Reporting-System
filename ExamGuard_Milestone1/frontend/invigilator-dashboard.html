<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invigilator | ExamGuard</title><link rel="stylesheet" href="css/style.css"><style>
body{padding:24px}.staff-wrap{max-width:1000px;margin:25px auto}.staff-card{background:#fff;border:1px solid #e3eae5;border-radius:16px;padding:24px;margin:18px 0}.staff-card input,.staff-card textarea,.staff-card select{width:100%;padding:12px;border:1px solid #dce6e1;border-radius:8px;margin:7px 0 14px;font:inherit}.staff-card button{background:#1D7775;color:#fff;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}.qrow{border:1px solid #e5ece8;border-radius:10px;padding:12px;margin:12px 0}.qrow label{display:block;font-size:13px}.topbar{display:flex;justify-content:space-between;align-items:center}
</style></head><body><div class="staff-wrap"><div class="topbar"><div class="brand-logo"><div class="logo-icon">E</div><span>ExamGuard · Invigilator</span></div><button id="logout">Logout</button></div><section class="staff-card"><h1>Create an examination</h1><p>Publish an MCQ examination for candidates.</p><label>Exam title</label><input id="title" value="Computer Science Demo Examination"><label>Description</label><textarea id="description">Basic Computer Science and IT Fundamentals</textarea><label>Duration (minutes)</label><input id="duration" type="number" min="1" max="180" value="15"><div id="questions"></div><button id="add">+ Add question</button> <button id="publish">Publish examination</button><p id="message" role="status"></p></section><section class="staff-card"><h2>Published examinations</h2><div id="exams">Loading...</div></section></div><script>
const API="http://127.0.0.1:8000",token=localStorage.getItem("examguard_access_token"),H={"Authorization":"Bearer "+token,"Content-Type":"application/json"},$=id=>document.getElementById(id);let count=0;
function addQuestion(q={}){count++;const d=document.createElement("div");d.className="qrow";d.innerHTML=`<b>Question ${count}</b><label>Question</label><input class="qt" placeholder="Enter question" value="${q.question_text||""}"><label>Option A</label><input class="a" placeholder="Option A" value="${q.option_a||""}"><label>Option B</label><input class="b" placeholder="Option B" value="${q.option_b||""}"><label>Option C</label><input class="c" placeholder="Option C" value="${q.option_c||""}"><label>Option D</label><input class="d" placeholder="Option D" value="${q.option_d||""}"><label>Correct option</label><select class="correct"><option>A</option><option>B</option><option>C</option><option>D</option></select>`;$("questions").appendChild(d)}
async function req(p,m="GET",b){const r=await fetch(API+p,{method:m,headers:H,...(b?{body:JSON.stringify(b)}:{})});const x=await r.json();if(!r.ok)throw Error(x.detail||"Request failed");return x}
$("add").onclick=()=>addQuestion();addQuestion();
$("publish").onclick=async()=>{try{const qs=[...document.querySelectorAll(".qrow")].map(x=>({question_text:x.querySelector(".qt").value,option_a:x.querySelector(".a").value,option_b:x.querySelector(".b").value,option_c:x.querySelector(".c").value,option_d:x.querySelector(".d").value,correct_option:x.querySelector(".correct").value}));const r=await req("/examinations","POST",{title:$("title").value,description:$("description").value,duration_minutes:Number($("duration").value),questions:qs});$("message").textContent="Published: "+r.title;load()}catch(e){$("message").textContent=e.message}};
async function load(){try{const xs=await req("/examinations");$("exams").innerHTML=xs.map(x=>`<p><b>${x.title}</b> — ${x.questions.length} questions, ${x.duration_minutes} min</p>`).join("")||"No examinations published."}catch(e){$("exams").textContent=e.message}}$("logout").onclick=()=>{localStorage.removeItem("examguard_access_token");location.href="login.html"};load();
</script></body></html>

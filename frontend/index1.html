<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>

</head>
<body>
    <h1>Javascript Variables</h1>
      <!--this all are keywords let,var,const-->
      <input type="text" name="demo" id="demo">
      <button type="button">Testing Value</button>
    <p id="p1"></p>
    <!--String -"",'', number boolean, arrays,objects,-->
    <!--logical operators are and  or && or // , !not-->
    <script>
      function myCacl(){
        const message=document.getElementById("p1");
        message.innerHTML="";
        let x=document.getElementById('demo').value;
      }
     
      try{
           if(x=="")throw "is Empty";
           if(isNaN(x)) throw "its not a number";
           x=Number(x);
           if(x>10) through "Its too High";
           if(x<5) through "Its too Low";
      }
      catch(err){
        message.innerHTML="Input"+err;
      }
      finally{
         document.getElementById("demo").innerHTML=err.message;
      }
    </script>
</body>
